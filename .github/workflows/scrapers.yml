name: SikshyaNepal Data Scrapers

on:
  schedule:
    # Every five hours. GitHub may start scheduled jobs a few minutes late.
    - cron: "17 0,5,10,15,20 * * *"
  workflow_dispatch:
    # Allows manual trigger from GitHub Actions tab

permissions:
  contents: read

concurrency:
  group: sikshyanepal-editorial-collectors
  cancel-in-progress: false

jobs:
  scrape:
    name: Run scrapers and update database
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: scrapers/requirements.txt

      - name: Install dependencies
        run: pip install -r scrapers/requirements.txt

      - name: Collect and verify college-first updates
        id: scrape
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ONESIGNAL_APP_ID: ${{ secrets.ONESIGNAL_APP_ID }}
          ONESIGNAL_REST_API_KEY: ${{ secrets.ONESIGNAL_REST_API_KEY }}
          SIKSHYANEPAL_URL: ${{ secrets.SIKSHYANEPAL_URL }}
          NOTIFICATION_SECRET: ${{ secrets.NOTIFICATION_SECRET }}
        run: |
          cd scrapers
          python run_all.py
          echo "exit_code=$?" >> $GITHUB_OUTPUT
        continue-on-error: true

      - name: Report scraper status
        run: |
          if [ "${{ steps.scrape.outputs.exit_code }}" = "1" ]; then
            echo "::warning::All scrapers failed. Check logs above."
          else
            echo "Scrapers completed successfully."
          fi
